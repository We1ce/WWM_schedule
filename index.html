<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲活動行事曆</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#182030',   /* 高質感深藍灰背景 */
                        cardBg: '#222d3f',   /* 元件與頂部背景色 */
                        borderBg: '#37465b'  /* 邊框顏色 */
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans pb-10">

    <!-- 頂部導覽列 -->
    <header class="bg-cardBg border-b border-borderBg p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-gamepad"></i> 遊戲活動行事曆
            </h1>
            <div id="actionButtons" class="flex flex-wrap gap-2">
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> 新增活動
                </button>
                <button onclick="openShareModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-share-nodes"></i> 匯出/分享
                </button>
                <button onclick="openImportModal()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-file-import"></i> 匯入代碼
                </button>
            </div>
        </div>
    </header>

    <!-- 唯讀模式提示 -->
    <div id="readOnlyBanner" class="hidden bg-amber-500/20 border-b border-amber-500/50 text-amber-200 px-4 py-2 text-center text-sm">
        <i class="fa-solid fa-eye mr-2"></i>您目前正在檢視分享的頁面（唯讀模式，無法編輯）
    </div>

    <main class="max-w-7xl mx-auto w-full p-4 flex-1 flex flex-col gap-8">

        <!-- 上半部：活動卡片區 -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <div class="flex gap-4 border-b border-borderBg">
                    <button id="tabActiveBtn" onclick="switchTab('active')" class="pb-2 font-semibold border-b-2 border-indigo-500 text-indigo-400">進行中活動</button>
                    <button id="tabEndedBtn" onclick="switchTab('ended')" class="pb-2 font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent">已結束活動</button>
                </div>
            </div>

            <!-- 卡片分區容器 -->
            <div id="cardsSection" class="space-y-6">
                <!-- 單次活動區 -->
                <div>
                    <h3 id="singleTitle" class="text-xs font-bold text-gray-400 mb-3 flex items-center gap-1">
                        <i class="fa-solid fa-flag"></i> 單次活動
                    </h3>
                    <div id="singleCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>

                <!-- 每週重複活動區 -->
                <div id="recurringSection" class="border-t border-borderBg/70 pt-6 mt-6">
                    <h3 class="text-xs font-bold text-gray-400 mb-3 flex items-center gap-1">
                        <i class="fa-solid fa-arrows-rotate"></i> 每週重複活動
                    </h3>
                    <div id="recurringCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
        </section>

        <!-- 下半部：本週活動 -->
        <section id="weeklyScheduleSection" class="flex-1 border-t border-borderBg pt-6">
            <h2 class="text-lg font-bold text-indigo-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-calendar-week"></i> 本週活動
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-7 gap-2">
                <!-- 週一至週日欄位 -->
                <script>
                    const days = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
                    days.forEach((day, index) => {
                        document.write(`
                            <div class="bg-cardBg rounded-lg p-3 border border-borderBg min-h-[200px] flex flex-col shadow-sm">
                                <h3 class="text-sm font-bold border-b border-borderBg pb-2 mb-2 text-center text-gray-300">${day}</h3>
                                <div id="schedule-day-${index + 1}" class="flex flex-col gap-2 flex-1"></div>
                            </div>
                        `);
                    });
                </script>
            </div>
        </section>

    </main>

    <!-- Modal: 新增/編輯活動 -->
    <div id="eventModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-cardBg border border-borderBg rounded-xl max-w-md w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold mb-4 text-indigo-400" id="modalTitle">新增活動卡片</h2>
            <form id="eventForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                
                <!-- 活動名稱 + 快速選單 -->
                <div>
                    <label class="block text-sm font-medium mb-1">活動名稱 <span class="text-red-400">*</span></label>
                    <div class="space-y-2">
                        <select id="presetTitleSelect" onchange="applyPresetTitle(this.value)" class="w-full bg-darkBg border border-borderBg rounded p-2 text-xs text-gray-300 focus:outline-none focus:border-indigo-500">
                            <option value="">-- 快速選擇預設活動 (可不選) --</option>
                            <option value="百業派對">百業派對</option>
                            <option value="百業一決高下">百業一決高下</option>
                            <option value="百業破軍殺將">百業破軍殺將</option>
                            <option value="百頁俠境">百頁俠境</option>
                            <option value="百業戰">百業戰</option>
                            <option value="競速團 Speedrun">競速團 Speedrun</option>
                        </select>
                        <input type="text" id="title" required placeholder="或自行輸入活動名稱..." class="w-full bg-darkBg border border-borderBg rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- 卡片色彩選擇器 -->
                <div>
                    <label class="block text-sm font-medium mb-1.5">卡片顏色主題</label>
                    <div class="flex items-center gap-2 overflow-x-auto pb-1" id="colorPickerContainer">
                        <!-- 選項由 JS 生成圓形選項 -->
                    </div>
                </div>

                <!-- 活動分類 -->
                <div>
                    <label class="block text-sm font-medium mb-1">活動分類</label>
                    <select id="category" onchange="toggleCategoryFields()" class="w-full bg-darkBg border border-borderBg rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="single">單次活動</option>
                        <option value="recurring">每週重複</option>
                    </select>
                </div>

                <!-- 每週重複選項 -->
                <div id="recurringFields" class="hidden space-y-3 p-3 bg-darkBg/50 rounded border border-borderBg/50">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-indigo-300">重複時間與星期設定</label>
                        <button type="button" onclick="addScheduleSlot()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded transition">
                            <i class="fa-solid fa-plus mr-1"></i>新增時間時段
                        </button>
                    </div>
                    <div id="scheduleSlotsContainer" class="space-y-3"></div>
                </div>

                <!-- 單次活動選項 -->
                <div id="singleFields" class="space-y-3 p-3 bg-darkBg/50 rounded border border-borderBg/50">
                    <div>
                        <label class="block text-xs mb-1">開始日期及時間 (24小時制)</label>
                        <div class="flex flex-wrap items-center gap-1 text-sm">
                            <input type="text" id="startYear" placeholder="YYYY" maxlength="4" oninput="handleYearInput(this, 'startMonth')" class="w-16 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>/</span>
                            <input type="text" id="startMonth" placeholder="MM" maxlength="2" oninput="handleMonthInput(this, 'startDay')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>/</span>
                            <input type="text" id="startDay" placeholder="DD" maxlength="2" oninput="handleDayInput(this, 'startYear', 'startMonth', 'startHour')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span class="ml-1 mr-1">時段:</span>
                            <input type="text" id="startHour" placeholder="時" maxlength="2" oninput="handleHourInput(this, 'startMin')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>:</span>
                            <input type="text" id="startMin" placeholder="分" maxlength="2" oninput="handleMinInput(this, 'endYear')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs">截止日期及時間 (24小時制)</label>
                            <label class="text-xs text-indigo-300 flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" id="sameAsStart" onchange="toggleSameAsStart()"> 同開始時間
                            </label>
                        </div>
                        <div id="endInputsContainer" class="flex flex-wrap items-center gap-1 text-sm transition-opacity">
                            <input type="text" id="endYear" placeholder="YYYY" maxlength="4" oninput="handleYearInput(this, 'endMonth')" class="w-16 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>/</span>
                            <input type="text" id="endMonth" placeholder="MM" maxlength="2" oninput="handleMonthInput(this, 'endDay')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>/</span>
                            <input type="text" id="endDay" placeholder="DD" maxlength="2" oninput="handleDayInput(this, 'endYear', 'endMonth', 'endHour')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span class="ml-1 mr-1">時段:</span>
                            <input type="text" id="endHour" placeholder="時" maxlength="2" oninput="handleHourInput(this, 'endMin')" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                            <span>:</span>
                            <input type="text" id="endMin" placeholder="分" maxlength="2" oninput="handleMinInput(this, null)" class="w-12 bg-darkBg border border-borderBg rounded p-1.5 text-center">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">活動內容</label>
                    <textarea id="content" rows="3" class="w-full bg-darkBg border border-borderBg rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="填寫活動細節、攻略或備註 (未填寫則不顯示)..."></textarea>
                </div>

                <!-- 隱私設定：不分享此活動 -->
                <div class="p-3 bg-darkBg/60 rounded border border-borderBg/60 flex items-center gap-2">
                    <input type="checkbox" id="doNotShare" class="w-4 h-4 rounded border-borderBg bg-darkBg text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                    <label for="doNotShare" class="text-xs text-gray-200 cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-lock text-gray-400"></i> 不分享此活動 <span class="text-gray-400 text-[11px]">(分享唯讀連結時將隱藏此卡片)</span>
                    </label>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 text-sm">取消</button>
                    <button type="submit" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: 匯出與分享 -->
    <div id="shareModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-cardBg border border-borderBg rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">匯出與分享</h2>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-medium mb-1">方法 A：複製匯出代碼 (可用於備份/移轉)</label>
                    <textarea id="exportCode" readonly rows="3" class="w-full bg-darkBg border border-borderBg rounded p-2 text-xs font-mono"></textarea>
                    <button onclick="copyToClipboard('exportCode')" class="mt-1 w-full bg-emerald-700 hover:bg-emerald-600 py-1.5 rounded text-xs">複製代碼</button>
                </div>
                <div>
                    <label class="block font-medium mb-1">方法 B：分享唯讀連結 (其他人開啟無法編輯)</label>
                    <input type="text" id="shareUrl" readonly class="w-full bg-darkBg border border-borderBg rounded p-2 text-xs font-mono">
                    <button onclick="copyToClipboard('shareUrl')" class="mt-1 w-full bg-indigo-700 hover:bg-indigo-600 py-1.5 rounded text-xs">複製唯讀網址</button>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeShareModal()" class="px-4 py-2 rounded bg-gray-700 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- Modal: 匯入代碼 -->
    <div id="importModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-cardBg border border-borderBg rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-amber-400">匯入活動代碼</h2>
            <div class="space-y-4">
                <p class="text-xs text-gray-400">貼上其他人分享給你的匯出代碼，這將會覆蓋你目前的活動列表。</p>
                <textarea id="importCodeInput" rows="4" class="w-full bg-darkBg border border-borderBg rounded p-2 text-xs font-mono" placeholder="貼上代碼..."></textarea>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeImportModal()" class="px-4 py-2 rounded bg-gray-700 text-sm">取消</button>
                <button onclick="processImport()" class="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500 text-sm font-medium">確認匯入</button>
            </div>
        </div>
    </div>

    <!-- 腳本 Logic -->
    <script>
        const DEFAULT_TIME = "05:00";
        let events = [];
        let currentTab = 'active';
        let isReadOnly = false;
        let editingEventId = null;
        let selectedColor = 'default';

        // 糖果色系與柔和明亮調之卡片色彩映射
        const colorPalette = {
            default:   { name: '預設藍灰', bgClass: 'bg-slate-800/90 border-slate-600/80', hex: '#475569' },
            red:       { name: '淺粉紅',   bgClass: 'bg-rose-900/50 border-pink-400/80 text-pink-100', hex: '#f472b6' },
            orange:    { name: '糖果橘',   bgClass: 'bg-orange-900/50 border-orange-400/80 text-orange-100', hex: '#fb923c' },
            yellow:    { name: '淡黃',     bgClass: 'bg-yellow-900/50 border-yellow-400/80 text-yellow-100', hex: '#facc15' },
            green:     { name: '淡綠',     bgClass: 'bg-emerald-900/50 border-emerald-400/80 text-emerald-100', hex: '#4ade80' },
            lightblue: { name: '淺藍',     bgClass: 'bg-sky-900/50 border-sky-400/80 text-sky-100', hex: '#38bdf8' },
            darkblue:  { name: '深藍',     bgClass: 'bg-indigo-900/50 border-indigo-400/80 text-indigo-100', hex: '#818cf8' },
            purple:    { name: '淡紫',     bgClass: 'bg-purple-900/50 border-purple-400/80 text-purple-100', hex: '#c084fc' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initColorPickerUI();
            const urlParams = new URLSearchParams(window.location.search);
            const shareData = urlParams.get('data');

            if (shareData) {
                try {
                    events = JSON.parse(decodeURIComponent(escape(atob(shareData))));
                    isReadOnly = true;
                    document.getElementById('readOnlyBanner').classList.remove('hidden');
                    document.getElementById('actionButtons').classList.add('hidden');
                } catch (e) {
                    alert('分享連結無效或已損壞');
                    loadLocalStorage();
                }
            } else {
                loadLocalStorage();
            }

            render();
        });

        function loadLocalStorage() {
            const localData = localStorage.getItem('game_events_data');
            if (localData) {
                try { events = JSON.parse(localData); } catch(e) { events = []; }
            }
        }

        function saveData() {
            if (isReadOnly) return;
            localStorage.setItem('game_events_data', JSON.stringify(events));
            render();
        }

        function initColorPickerUI() {
            const container = document.getElementById('colorPickerContainer');
            container.innerHTML = '';
            Object.keys(colorPalette).forEach(key => {
                const item = colorPalette[key];
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.title = item.name;
                btn.className = `w-7 h-7 rounded-full transition-transform border-2 flex items-center justify-center flex-shrink-0 ${selectedColor === key ? 'scale-110 border-white' : 'border-transparent opacity-80 hover:opacity-100'}`;
                btn.style.backgroundColor = item.hex;
                btn.onclick = () => selectColor(key);
                btn.id = `color-btn-${key}`;
                container.appendChild(btn);
            });
        }

        function selectColor(key) {
            selectedColor = key;
            Object.keys(colorPalette).forEach(k => {
                const btn = document.getElementById(`color-btn-${k}`);
                if (btn) {
                    if (k === key) {
                        btn.classList.add('scale-110', 'border-white');
                        btn.classList.remove('border-transparent', 'opacity-80');
                    } else {
                        btn.classList.remove('scale-110', 'border-white');
                        btn.classList.add('border-transparent', 'opacity-80');
                    }
                }
            });
        }

        function openModal() { 
            editingEventId = null;
            document.getElementById('modalTitle').innerText = "新增活動卡片";
            resetForm();
            document.getElementById('eventModal').classList.remove('hidden'); 
        }

        function closeModal() { 
            document.getElementById('eventModal').classList.add('hidden'); 
            resetForm(); 
        }

        // 開啟分享視窗時，自動過濾掉「不分享」的活動
        function openShareModal() {
            const shareableEvents = events.filter(ev => !ev.doNotShare);
            const jsonStr = JSON.stringify(shareableEvents);
            const b64Str = btoa(unescape(encodeURIComponent(jsonStr)));
            document.getElementById('exportCode').value = b64Str;
            
            const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(b64Str)}`;
            document.getElementById('shareUrl').value = shareUrl;

            document.getElementById('shareModal').classList.remove('hidden');
        }

        function closeShareModal() { document.getElementById('shareModal').classList.add('hidden'); }
        function openImportModal() { document.getElementById('importModal').classList.remove('hidden'); }
        function closeImportModal() { document.getElementById('importModal').classList.add('hidden'); }

        function toggleCategoryFields() {
            const category = document.getElementById('category').value;
            const isRec = category === 'recurring';
            document.getElementById('recurringFields').classList.toggle('hidden', !isRec);
            document.getElementById('singleFields').classList.toggle('hidden', isRec);
        }

        function applyPresetTitle(val) {
            if (val) {
                document.getElementById('title').value = val;
            }
        }

        function toggleSameAsStart() {
            const isSame = document.getElementById('sameAsStart').checked;
            const container = document.getElementById('endInputsContainer');

            if (isSame) {
                document.getElementById('endYear').value = document.getElementById('startYear').value;
                document.getElementById('endMonth').value = document.getElementById('startMonth').value;
                document.getElementById('endDay').value = document.getElementById('startDay').value;
                document.getElementById('endHour').value = document.getElementById('startHour').value;
                document.getElementById('endMin').value = document.getElementById('startMin').value;

                container.classList.add('opacity-40', 'pointer-events-none');
            } else {
                container.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        function autoSyncSameAsStart() {
            if (document.getElementById('sameAsStart').checked) {
                toggleSameAsStart();
            }
        }

        function focusNext(nextId) {
            if (!nextId) return;
            setTimeout(() => {
                const nextEl = document.getElementById(nextId);
                if (nextEl) nextEl.focus();
            }, 10);
        }

        function handleYearInput(input, nextId) {
            input.value = input.value.replace(/\D/g, '');
            autoSyncSameAsStart();
            if (input.value.length >= 4) focusNext(nextId);
        }

        function handleMonthInput(input, nextId) {
            input.value = input.value.replace(/\D/g, '');
            let val = parseInt(input.value, 10);
            if (val > 12) input.value = "12";
            autoSyncSameAsStart();
            if (input.value.length >= 2) focusNext(nextId);
        }

        function handleDayInput(input, yearId, monthId, nextId) {
            input.value = input.value.replace(/\D/g, '');
            const y = parseInt(document.getElementById(yearId).value, 10) || new Date().getFullYear();
            const m = parseInt(document.getElementById(monthId).value, 10) || 1;
            const maxDays = new Date(y, m, 0).getDate();
            
            let val = parseInt(input.value, 10);
            if (val > maxDays) input.value = maxDays.toString();
            autoSyncSameAsStart();
            if (input.value.length >= 2) focusNext(nextId);
        }

        function handleHourInput(input, nextId) {
            input.value = input.value.replace(/\D/g, '');
            let val = parseInt(input.value, 10);
            if (val > 23) input.value = "23";
            autoSyncSameAsStart();
            if (input.value.length >= 2) focusNext(nextId);
        }

        function handleMinInput(input, nextId) {
            input.value = input.value.replace(/\D/g, '');
            let val = parseInt(input.value, 10);
            if (val > 59) input.value = "59";
            autoSyncSameAsStart();
            if (input.value.length >= 2) focusNext(nextId);
        }

        let scheduleSlotCount = 0;

        function addScheduleSlot(data = null) {
            scheduleSlotCount++;
            const container = document.getElementById('scheduleSlotsContainer');
            const slotDiv = document.createElement('div');
            slotDiv.className = "schedule-slot p-3 bg-darkBg border border-borderBg rounded space-y-2 relative";
            slotDiv.id = `slot-${scheduleSlotCount}`;

            const sHour = data ? (data.startTime ? data.startTime.split(':')[0] : '05') : '';
            const sMin  = data ? (data.startTime ? data.startTime.split(':')[1] : '00') : '';
            const eHour = data ? (data.endTime ? data.endTime.split(':')[0] : '05') : '';
            const eMin  = data ? (data.endTime ? data.endTime.split(':')[1] : '00') : '';
            const days  = data ? (data.days || []) : [];

            slotDiv.innerHTML = `
                <div class="flex justify-between items-center border-b border-borderBg/40 pb-1">
                    <span class="text-xs font-semibold text-indigo-300">時段設定</span>
                    <button type="button" onclick="removeScheduleSlot('slot-${scheduleSlotCount}')" class="text-[11px] text-red-400 hover:text-red-300">刪除時段</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">開始時間 (24小時制)</label>
                        <div class="flex items-center gap-1 text-xs">
                            <input type="text" class="slot-s-hour w-12 bg-darkBg border border-borderBg rounded p-1 text-center" placeholder="時" maxlength="2" value="${sHour}" oninput="handleHourInput(this, null)">
                            <span>:</span>
                            <input type="text" class="slot-s-min w-10 bg-darkBg border border-borderBg rounded p-1 text-center" placeholder="分" maxlength="2" value="${sMin}" oninput="handleMinInput(this, null)">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">結束時間 (24小時制)</label>
                        <div class="flex items-center gap-1 text-xs">
                            <input type="text" class="slot-e-hour w-12 bg-darkBg border border-borderBg rounded p-1 text-center" placeholder="時" maxlength="2" value="${eHour}" oninput="handleHourInput(this, null)">
                            <span>:</span>
                            <input type="text" class="slot-e-min w-10 bg-darkBg border border-borderBg rounded p-1 text-center" placeholder="分" maxlength="2" value="${eMin}" oninput="handleMinInput(this, null)">
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-0.5">重複星期 (複選)</label>
                    <div class="grid grid-cols-7 gap-1 text-[11px]">
                        ${[1,2,3,4,5,6,7].map(d => `
                            <label class="flex items-center gap-0.5"><input type="checkbox" class="slot-day" value="${d}" ${days.includes(d) ? 'checked' : ''}> ${['一','二','三','四','五','六','日'][d-1]}</label>
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(slotDiv);
        }

        function removeScheduleSlot(id) {
            const slot = document.getElementById(id);
            if (slot) slot.remove();
        }

        function getSchedulesFromForm() {
            const slots = document.querySelectorAll('.schedule-slot');
            const result = [];
            slots.forEach(slot => {
                const sH = (slot.querySelector('.slot-s-hour').value.trim() || '05').padStart(2, '0');
                const sM = (slot.querySelector('.slot-s-min').value.trim() || '00').padStart(2, '0');
                const eH = (slot.querySelector('.slot-e-hour').value.trim() || '05').padStart(2, '0');
                const eM = (slot.querySelector('.slot-e-min').value.trim() || '00').padStart(2, '0');

                const checkedDays = Array.from(slot.querySelectorAll('.slot-day:checked')).map(cb => parseInt(cb.value));

                result.push({
                    startTime: `${sH}:${sM}`,
                    endTime: `${eH}:${eM}`,
                    days: checkedDays
                });
            });
            return result;
        }

        function getDateFromInputs(prefix) {
            const y = document.getElementById(`${prefix}Year`).value.trim();
            const m = document.getElementById(`${prefix}Month`).value.trim().padStart(2, '0');
            const d = document.getElementById(`${prefix}Day`).value.trim().padStart(2, '0');
            if (!y || !m || !d) return "";
            return `${y}-${m}-${d}`;
        }

        function setDateToInputs(prefix, dateStr) {
            if (!dateStr) {
                document.getElementById(`${prefix}Year`).value = "";
                document.getElementById(`${prefix}Month`).value = "";
                document.getElementById(`${prefix}Day`).value = "";
                return;
            }
            const parts = dateStr.split('-');
            document.getElementById(`${prefix}Year`).value = parts[0] || "";
            document.getElementById(`${prefix}Month`).value = parts[1] || "";
            document.getElementById(`${prefix}Day`).value = parts[2] || "";
        }

        function getTimeFromInputs(prefix) {
            const hRaw = document.getElementById(`${prefix}Hour`).value.trim();
            const mRaw = document.getElementById(`${prefix}Min`).value.trim();
            if (!hRaw && !mRaw) return DEFAULT_TIME;
            
            let h = parseInt(hRaw || "5", 10);
            let m = parseInt(mRaw || "0", 10);

            if (isNaN(h) || h < 0) h = 5;
            if (h > 23) h = 23;
            if (isNaN(m) || m < 0) m = 0;
            if (m > 59) m = 59;

            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function setTimeToInputs(prefix, timeStr) {
            if (!timeStr) {
                document.getElementById(`${prefix}Hour`).value = "";
                document.getElementById(`${prefix}Min`).value = "";
                return;
            }
            const parts = timeStr.split(':');
            document.getElementById(`${prefix}Hour`).value = parts[0] || "";
            document.getElementById(`${prefix}Min`).value = parts[1] || "";
        }

        function resetForm() {
            document.getElementById('eventForm').reset();
            document.getElementById('presetTitleSelect').value = "";
            document.getElementById('scheduleSlotsContainer').innerHTML = "";
            document.getElementById('sameAsStart').checked = false;
            document.getElementById('doNotShare').checked = false;
            toggleSameAsStart();
            selectColor('default');
            setDateToInputs('start', '');
            setDateToInputs('end', '');
            setTimeToInputs('start', '');
            setTimeToInputs('end', '');
            toggleCategoryFields();
        }

        function editEvent(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;

            editingEventId = id;
            document.getElementById('modalTitle').innerText = "編輯活動卡片";

            document.getElementById('title').value = ev.title;
            document.getElementById('presetTitleSelect').value = "";
            selectColor(ev.color || 'default');
            
            const category = ev.category || (ev.isRecurring ? 'recurring' : 'single');
            document.getElementById('category').value = category;
            document.getElementById('content').value = ev.content || "";
            document.getElementById('doNotShare').checked = ev.doNotShare || false;

            toggleCategoryFields();

            if (category === 'recurring') {
                document.getElementById('scheduleSlotsContainer').innerHTML = "";
                const slots = ev.schedules || [{ startTime: ev.startTime, endTime: ev.endTime, days: ev.days }];
                slots.forEach(slot => addScheduleSlot(slot));
            } else {
                setDateToInputs('start', ev.startDate || '');
                setTimeToInputs('start', ev.startTime || DEFAULT_TIME);
                setDateToInputs('end', ev.endDate || '');
                setTimeToInputs('end', ev.endTime || DEFAULT_TIME);

                document.getElementById('sameAsStart').checked = ev.sameAsStart || false;
                toggleSameAsStart();
            }

            document.getElementById('eventModal').classList.remove('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const category = document.getElementById('category').value;
            const isRec = category === 'recurring';
            
            const eventData = {
                id: editingEventId ? editingEventId : Date.now().toString(),
                title: document.getElementById('title').value,
                color: selectedColor,
                category: category,
                isRecurring: isRec,
                content: document.getElementById('content').value,
                doNotShare: document.getElementById('doNotShare').checked
            };

            if (isRec) {
                eventData.schedules = getSchedulesFromForm();
            } else {
                const sameAsStart = document.getElementById('sameAsStart').checked;
                eventData.sameAsStart = sameAsStart;
                eventData.startDate = getDateFromInputs('start');
                eventData.startTime = getTimeFromInputs('start');
                
                if (sameAsStart) {
                    eventData.endDate = eventData.startDate;
                    eventData.endTime = eventData.startTime;
                } else {
                    eventData.endDate = getDateFromInputs('end');
                    eventData.endTime = getTimeFromInputs('end');
                }
            }

            if (editingEventId) {
                const index = events.findIndex(e => e.id === editingEventId);
                if (index !== -1) events[index] = eventData;
            } else {
                events.push(eventData);
            }

            saveData();
            closeModal();
        }

        function deleteEvent(id) {
            if (isReadOnly) return;
            if (confirm('確定要刪除這個活動嗎？')) {
                events = events.filter(e => e.id !== id);
                saveData();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const activeBtn = document.getElementById('tabActiveBtn');
            const endedBtn = document.getElementById('tabEndedBtn');
            const weeklySection = document.getElementById('weeklyScheduleSection');

            if (tab === 'active') {
                activeBtn.className = "pb-2 font-semibold border-b-2 border-indigo-500 text-indigo-400";
                endedBtn.className = "pb-2 font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent";
                weeklySection.classList.remove('hidden');
            } else {
                endedBtn.className = "pb-2 font-semibold border-b-2 border-indigo-500 text-indigo-400";
                activeBtn.className = "pb-2 font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent";
                weeklySection.classList.add('hidden');
            }
            renderCards();
        }

        function calculateRemainingDays(endDateStr, endTimeStr) {
            if (!endDateStr) return { days: 0, isEnded: false };
            const endDateTime = new Date(`${endDateStr}T${endTimeStr || DEFAULT_TIME}`);
            const now = new Date();
            const diffTime = endDateTime - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return {
                days: diffDays,
                isEnded: diffTime <= 0
            };
        }

        function formatDisplayDates(startDateStr, endDateStr) {
            if (!startDateStr && !endDateStr) return { start: '未定', end: '未定' };
            const currentYear = new Date().getFullYear();

            const sParts = startDateStr ? startDateStr.split('-') : [];
            const eParts = endDateStr ? endDateStr.split('-') : [];

            const sYear = sParts[0] ? parseInt(sParts[0], 10) : currentYear;
            const eYear = eParts[0] ? parseInt(eParts[0], 10) : currentYear;

            const hideYear = (sYear === currentYear && eYear === currentYear);

            let sFormatted = '未定';
            let eFormatted = '未定';

            if (sParts.length === 3) {
                sFormatted = hideYear ? `${sParts[1]}/${sParts[2]}` : `${sParts[0]}/${sParts[1]}/${sParts[2]}`;
            }
            if (eParts.length === 3) {
                eFormatted = hideYear ? `${eParts[1]}/${eParts[2]}` : `${eParts[0]}/${eParts[1]}/${eParts[2]}`;
            }

            return { start: sFormatted, end: eFormatted };
        }

        let draggedEventId = null;

        function handleDragStart(e, id) {
            draggedEventId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('opacity-50');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetId) {
            e.preventDefault();
            if (!draggedEventId || draggedEventId === targetId) return;

            const fromIndex = events.findIndex(ev => ev.id === draggedEventId);
            const toIndex = events.findIndex(ev => ev.id === targetId);

            if (fromIndex !== -1 && toIndex !== -1) {
                const [movedItem] = events.splice(fromIndex, 1);
                events.splice(toIndex, 0, movedItem);
                saveData();
            }
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('opacity-50');
            draggedEventId = null;
        }

        function render() {
            renderCards();
            renderSchedule();
        }

        function renderCards() {
            const singleContainer = document.getElementById('singleCardsContainer');
            const recurringContainer = document.getElementById('recurringCardsContainer');
            const recurringSection = document.getElementById('recurringSection');
            const singleTitle = document.getElementById('singleTitle');

            singleContainer.innerHTML = '';
            recurringContainer.innerHTML = '';

            const filteredEvents = events.filter(ev => {
                const isRec = ev.category === 'recurring' || ev.isRecurring;
                if (isRec) return currentTab === 'active';
                const { isEnded } = calculateRemainingDays(ev.endDate, ev.endTime);
                return currentTab === 'active' ? !isEnded : isEnded;
            });

            const singleEvents = filteredEvents.filter(ev => !(ev.category === 'recurring' || ev.isRecurring));
            const recurringEvents = filteredEvents.filter(ev => (ev.category === 'recurring' || ev.isRecurring));

            if (currentTab === 'ended') {
                recurringSection.classList.add('hidden');
                singleTitle.innerText = "已結束活動";
            } else {
                singleTitle.innerHTML = `<i class="fa-solid fa-flag"></i> 單次活動`;
                recurringSection.classList.toggle('hidden', recurringEvents.length === 0);
            }

            if (filteredEvents.length === 0) {
                singleContainer.innerHTML = `<div class="col-span-full text-center text-gray-500 py-8">尚無${currentTab === 'active' ? '進行中' : '已結束'}的活動</div>`;
                return;
            }

            singleEvents.forEach(ev => {
                singleContainer.appendChild(createCardElement(ev, true));
            });

            recurringEvents.forEach(ev => {
                recurringContainer.appendChild(createCardElement(ev, false));
            });
        }

        function createCardElement(ev, isDraggable) {
            const card = document.createElement('div');
            const colorConfig = colorPalette[ev.color || 'default'] || colorPalette.default;
            const isRec = ev.category === 'recurring' || ev.isRecurring;

            card.className = `${colorConfig.bgClass} border rounded-xl p-4 shadow-md flex flex-col justify-between relative group transition-all`;
            
            if (isDraggable && !isReadOnly && currentTab === 'active') {
                card.draggable = true;
                card.ondragstart = (e) => handleDragStart(e, ev.id);
                card.ondragover = (e) => handleDragOver(e);
                card.ondrop = (e) => handleDrop(e, ev.id);
                card.ondragend = (e) => handleDragEnd(e);
            }

            let timeInfoHtml = '';
            let statusBadge = '';

            // 如果勾選「不分享」，顯示灰色的私密標籤
            const privateBadge = (ev.doNotShare && !isReadOnly) 
                ? `<span class="bg-gray-800/80 text-gray-300 border border-gray-600/60 text-xs font-medium px-2 py-0.5 rounded-full flex items-center gap-1" title="分享網址時將不會顯示此卡片"><i class="fa-solid fa-lock text-[10px]"></i>不分享</span>`
                : '';

            if (isRec) {
                const daysMap = ['一', '二', '三', '四', '五', '六', '日'];
                const slots = ev.schedules || [{ startTime: ev.startTime, endTime: ev.endTime, days: ev.days }];
                
                const slotsHtml = slots.map(s => {
                    const dayNames = (s.days || []).map(d => daysMap[d-1]).join('、');
                    return `
                        <div class="text-xs text-indigo-200 mb-1 border-l-2 border-indigo-400/50 pl-2 my-1">
                            <div><i class="fa-regular fa-clock mr-1"></i>每週 ${dayNames || '未選擇'}</div>
                            <div class="text-gray-300 text-[11px]">${s.startTime} ~ ${s.endTime}</div>
                        </div>
                    `;
                }).join('');

                timeInfoHtml = `<div class="space-y-1">${slotsHtml}</div>`;
                statusBadge = `<span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-xs font-medium px-2.5 py-0.5 rounded-full">每週重複</span>`;
            } else {
                const { days, isEnded } = calculateRemainingDays(ev.endDate, ev.endTime);
                const formattedDates = formatDisplayDates(ev.startDate, ev.endDate);

                const isSameTime = ev.sameAsStart || (ev.startDate === ev.endDate && ev.startTime === ev.endTime);

                if (isSameTime) {
                    timeInfoHtml = `
                        <div class="text-xs text-gray-200 mb-1"><i class="fa-regular fa-calendar mr-1"></i>${formattedDates.start} ${ev.startTime}</div>
                    `;
                } else {
                    timeInfoHtml = `
                        <div class="text-xs text-gray-200 mb-1"><i class="fa-regular fa-calendar mr-1"></i>${formattedDates.start} ${ev.startTime}起</div>
                        <div class="text-xs text-gray-300">至 ${formattedDates.end} ${ev.endTime}</div>
                    `;
                }

                if (isEnded) {
                    statusBadge = `<span class="bg-gray-500/20 text-gray-300 border border-gray-500/40 text-xs font-medium px-2.5 py-0.5 rounded-full">已結束</span>`;
                } else {
                    statusBadge = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-medium px-2.5 py-0.5 rounded-full">剩餘 ${days} 天</span>`;
                }
            }

            const contentHtml = (ev.content && ev.content.trim() !== '') 
                ? `<p class="text-sm text-gray-200 mt-3 whitespace-pre-line bg-darkBg/50 p-2 rounded border border-borderBg/40">${ev.content}</p>`
                : '';

            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div class="flex items-center gap-1.5 break-words">
                            ${isDraggable && !isReadOnly && currentTab === 'active' ? `<i class="fa-solid fa-grip-vertical text-gray-400 cursor-move hover:text-gray-200" title="拖曳排序"></i>` : ''}
                            <h3 class="font-bold text-gray-100 text-base">${ev.title}</h3>
                        </div>
                        <div class="flex items-center gap-1">
                            ${privateBadge}
                            ${statusBadge}
                        </div>
                    </div>
                    ${timeInfoHtml}
                    ${contentHtml}
                </div>
                ${!isReadOnly ? `
                    <div class="mt-4 pt-2 border-t border-borderBg/40 flex justify-end gap-3">
                        <button onclick="editEvent('${ev.id}')" class="text-xs text-indigo-300 hover:text-indigo-200 transition flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> 編輯
                        </button>
                        <button onclick="deleteEvent('${ev.id}')" class="text-xs text-red-400 hover:text-red-300 transition flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> 刪除
                        </button>
                    </div>
                ` : ''}
            `;
            return card;
        }

        function renderSchedule() {
            for (let i = 1; i <= 7; i++) {
                document.getElementById(`schedule-day-${i}`).innerHTML = '';
            }

            events.forEach(ev => {
                const isRec = ev.category === 'recurring' || ev.isRecurring;
                if (isRec) {
                    const slots = ev.schedules || [{ startTime: ev.startTime, endTime: ev.endTime, days: ev.days }];
                    slots.forEach(slot => {
                        if (slot.days) {
                            slot.days.forEach(day => {
                                const targetCol = document.getElementById(`schedule-day-${day}`);
                                if (targetCol) {
                                    targetCol.appendChild(createScheduleItem(ev.title, `${slot.startTime}-${slot.endTime}`, ev.color));
                                }
                            });
                        }
                    });
                }
            });
        }

        function createScheduleItem(title, timeStr, colorKey) {
            const item = document.createElement('div');
            const colorConfig = colorPalette[colorKey || 'default'] || colorPalette.default;
            item.className = `p-2 rounded border text-xs flex flex-col gap-1 ${colorConfig.bgClass} text-indigo-100`;
            item.innerHTML = `
                <span class="font-semibold truncate">${title}</span>
                <span class="text-[10px] opacity-80"><i class="fa-regular fa-clock"></i> ${timeStr}</span>
            `;
            return item;
        }

        function processImport() {
            const code = document.getElementById('importCodeInput').value.trim();
            if (!code) return;
            try {
                const jsonStr = decodeURIComponent(escape(atob(code)));
                const importedEvents = JSON.parse(jsonStr);
                if (Array.isArray(importedEvents)) {
                    events = importedEvents;
                    saveData();
                    closeImportModal();
                    document.getElementById('importCodeInput').value = '';
                    alert('匯入成功！');
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert('代碼格式錯誤，匯入失敗。');
            }
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("已成功複製到剪貼簿！");
        }
    </script>
</body>
</html>
